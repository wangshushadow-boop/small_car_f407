small_car_motion_controller:
  ros__parameters:
    control_rate_hz: 20.0
    direct_command_timeout_s: 0.5
    odom_timeout_s: 0.4
    default_action_timeout_s: 15.0
    front_obstacle_stop_m: 0.20

    # 定距直行：剩余距离乘以比例增益得到目标速度，再限制到最小/最大速度。
    drive_kp: 1.2
    drive_min_speed_mps: 0.12
    drive_max_speed_mps: 0.35
    drive_tolerance_m: 0.02

    # 直行时使用航向误差修正左右轮差异。
    heading_kp: 1.5
    heading_max_angular_rad_s: 0.6

    # 定角转向参数。
    spin_kp: 2.0
    spin_min_speed_rad_s: 0.45
    spin_max_speed_rad_s: 1.2
    spin_tolerance_rad: 0.035

    # ROS 输出端二次限速，MCU 内部还有一层轮速斜坡。
    linear_accel_limit_mps2: 0.5
    angular_accel_limit_rad_s2: 1.8
    settle_cycles: 3
