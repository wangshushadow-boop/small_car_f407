small_car_base:
  ros__parameters:
    serial_port: /dev/small_car_mcu
    baud_rate: 115200
    # /cmd_vel 使用 TwistStamped；底盘节点只执行最终硬限幅和失效保护。
    max_linear_speed_mps: 0.6
    max_angular_speed_rad_s: 2.0
    cmd_vel_timeout_ms: 500
    front_stop_distance_m: 0.20
    command_rate_hz: 20.0
    # 串口写失败时通知树莓派宿主机复位 USB 并重建容器。
    mcu_recovery_request: /workspace/rpi_host/runtime/mcu_recovery.request

    odom_frame: odom
    base_frame: base_link
    imu_frame: imu_link
    ultrasonic_frame: ultrasonic_link
    publish_tf: true
    # 调试接口统一位于 /debug；关闭时不创建原始 IMU publisher。
    debug_enabled: false
    # RViz 需要轮子和舵机关节状态；关闭后 MCU 不再上传轮速调试流。
    publish_joint_states: true

    # 65 mm 车轮的半径；实测后可继续标定。
    wheel_radius_m: 0.0325
    ultrasonic_min_range_m: 0.02
    ultrasonic_max_range_m: 4.0
    ultrasonic_field_of_view_rad: 0.52

    # 初始协方差，完成重复性实验后按实测方差调整。
    odom_position_variance: 0.01
    odom_orientation_variance: 0.02
    odom_linear_velocity_variance: 0.04
    odom_angular_velocity_variance: 0.05
    imu_acceleration_variance: 0.1
    imu_angular_velocity_variance: 0.02
    imu_orientation_variance: 0.02

    # 舵机弧度与 PWM 的线性映射。正负方向可用 sign 调整。
    upper_servo_center_us: 1500
    upper_servo_min_us: 800
    upper_servo_max_us: 2300
    upper_servo_range_rad: 3.14159
    upper_servo_sign: 1.0
    lower_servo_center_us: 1250
    lower_servo_min_us: 800
    lower_servo_max_us: 1700
    lower_servo_range_rad: 3.14159
    lower_servo_sign: 1.0
