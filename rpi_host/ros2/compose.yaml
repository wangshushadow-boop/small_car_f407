services:
  small_car_ros2:
    build:
      context: ..
      dockerfile: ros2/Dockerfile
    image: small-car-ros2:kilted
    network_mode: host
    ipc: host
    devices:
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C2C059301-if00:/dev/small_car_mcu
    volumes:
      - ..:/workspace/rpi_host
    working_dir: /workspace/rpi_host/ros2_ws
    command: >-
      bash -lc "source /opt/ros/kilted/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash &&
      ros2 launch smallcar_ros_and_mcu_bridge bridge.launch.py"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
